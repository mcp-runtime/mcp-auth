services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
      - --hostname=http://keycloak:8080
      - --http-port=8080
      - --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ../tests/e2e/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/mcp HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 2 cat <&3 | grep -q mcp"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  mcp-auth-keygen:
    image: alpine:3.22
    command: >-
      sh -c "apk add --no-cache openssl >/dev/null &&
      chmod 0777 /keys /data && openssl genrsa -out /keys/signing.pem 2048 &&
      chmod 0644 /keys/signing.pem && sleep infinity"
    volumes:
      - mcp-auth-keys:/keys
      - mcp-auth-data:/data
    healthcheck:
      test: ["CMD", "test", "-s", "/keys/signing.pem"]
      interval: 2s
      timeout: 2s
      retries: 15

  resource-keygen:
    image: alpine:3.22
    command: >-
      sh -c "apk add --no-cache openssl >/dev/null &&
      chmod 0777 /var/lib/mcp-resource-auth &&
      openssl genrsa -out /var/lib/mcp-resource-auth/private.pem 2048 &&
      openssl rsa -in /var/lib/mcp-resource-auth/private.pem -pubout -out /var/lib/mcp-resource-auth/public.pem &&
      printf '%s\\n' compose-e2e-key > /var/lib/mcp-resource-auth/key_id &&
      printf '%s' '[{\"client_id\":\"compose-resource-server\",\"name\":\"demo-mcp e2e\",\"resource\":\"http://mcp-server:6328/mcp\",\"public_key_file\":\"/var/lib/mcp-resource-auth/public.pem\"}]' > /var/lib/mcp-resource-auth/resource-clients.json &&
      chmod 0644 /var/lib/mcp-resource-auth/private.pem /var/lib/mcp-resource-auth/public.pem /var/lib/mcp-resource-auth/key_id /var/lib/mcp-resource-auth/resource-clients.json &&
      sleep infinity"
    volumes:
      - resource-auth-keys:/var/lib/mcp-resource-auth
    healthcheck:
      test: ["CMD", "test", "-s", "/var/lib/mcp-resource-auth/resource-clients.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  mcp-server:
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile.demo-mcp
    environment:
      PUBLIC_BASE_URL: http://mcp-server:6328
      MCP_SERVER_URL: http://mcp-server:6328
      MCP_PATH: /mcp
      MCP_PORT: "6328"
      MCP_AUTH_ISSUER: http://mcp-auth:8080
      MCP_AUTH_JWKS_URI: http://mcp-auth:8080/.well-known/jwks.json
      MCP_ALLOWED_HOSTS: mcp-server,mcp-server:6328,localhost,127.0.0.1
    volumes:
      - resource-auth-keys:/var/lib/mcp-resource-auth:ro
    depends_on:
      resource-keygen:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:6328/.well-known/oauth-protected-resource/mcp')
      interval: 2s
      timeout: 2s
      retries: 20

  mcp-auth:
    build:
      context: ../auth-server
      dockerfile: Dockerfile
    environment:
      MCP_AUTH_ISSUER: http://mcp-auth:8080
      MCP_AUTH_RESOURCES: http://mcp-server:6328/mcp
      MCP_AUTH_LISTEN_ADDR: :8080
      MCP_AUTH_ALLOWED_SCOPES: tools:read
      MCP_AUTH_REQUIRE_HTTPS: "false"
      MCP_AUTH_REGISTRATION_ENABLED: "true"
      MCP_AUTH_AUTHORIZATION_RESPONSE_ISS: "true"
      MCP_AUTH_PRIVATE_KEY_FILE: /keys/signing.pem
      MCP_AUTH_STORE: sqlite
      MCP_AUTH_DATABASE_URL: /data/mcp-auth.db
      MCP_AUTH_CONNECTORS_FILE: /etc/mcp-auth/connectors.json
      MCP_AUTH_CONNECTOR: compose-oidc
      MCP_AUTH_ALLOW_INSECURE_CONNECTORS: "true"
      MCP_AUTH_RESOURCE_CLIENTS_FILE: /var/lib/mcp-resource-auth/resource-clients.json
      KEYCLOAK_CLIENT_SECRET: e2e-client-secret
    volumes:
      - mcp-auth-keys:/keys:ro
      - mcp-auth-data:/data
      - ../tests/e2e/keycloak-connectors.json:/etc/mcp-auth/connectors.json:ro
      - resource-auth-keys:/var/lib/mcp-resource-auth:ro
    depends_on:
      mcp-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mcp-auth-keygen:
        condition: service_healthy
      resource-keygen:
        condition: service_healthy

  e2e-client:
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile.e2e-client
    volumes:
      - resource-auth-keys:/var/lib/mcp-resource-auth:ro
    depends_on:
      mcp-auth:
        condition: service_started
      mcp-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      resource-keygen:
        condition: service_healthy

networks:
  default:
    name: ${MCP_AUTH_E2E_NETWORK:-mcp-auth-e2e}
    ipam:
      config:
        - subnet: ${MCP_AUTH_E2E_SUBNET:-172.29.0.0/24}

volumes:
  mcp-auth-keys:
  mcp-auth-data:
  resource-auth-keys:
