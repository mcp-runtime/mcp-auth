[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-auth-client"
version = "0.3.0"
description = "Provider-neutral OAuth and MCP resource-server SDK"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prince Roshan" }]
dependencies = [
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.15,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]
fastmcp = ["fastmcp>=3.2,<5"]

[tool.setuptools]
package-dir = { "" = "auth-client/python/src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["auth-client/python/src"]

[tool.setuptools.package-data]
mcp_auth_client = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcp_auth_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
markers = [
  "e2e: starts the local authorization server and exercises the MCP OAuth flow",
]
